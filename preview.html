<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FragPunk · 效果拆解</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0e12;color:#ecf3df;font:15px system-ui,-apple-system,sans-serif}main{max-width:1500px;margin:auto;padding:30px}header{display:flex;align-items:baseline;gap:20px;margin-bottom:22px}h1{font-size:26px;margin:0}header p{color:#8e9b9f;margin:0}#viewer{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:black;border:1px solid #293138;border-radius:8px}iframe{position:absolute;left:0;top:0;border:0;width:1920px;height:1080px;transform-origin:top left}.transport{display:flex;align-items:center;gap:15px;padding:17px 0}.transport input{flex:1}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #596850;background:#b9f45b;color:#142109;padding:9px 17px;border-radius:5px}button.secondary{background:#182128;color:#e9f2e1;border-color:#34424a}#time{font-variant-numeric:tabular-nums;width:90px;color:#bdd28c}input[type=range]{accent-color:#bef465}.controls{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:20px}.card{background:#131a20;border:1px solid #29343b;padding:20px;border-radius:7px}.card h2{font-size:16px;margin:0 0 16px}.card p{color:#a0acb0;font-size:13px;line-height:1.65;margin-bottom:0}label{display:flex;align-items:center;gap:12px;margin:13px 0}label span{min-width:85px;color:#c1cbd0}label input[type=range]{width:100%}input[type=text],select{background:#080d11;color:#e9f2e1;border:1px solid #39464e;padding:8px;border-radius:4px;max-width:100%;min-width:0}#text{width:150px}#status{color:#bdcf9d;font-size:13px}.links{margin-top:22px;color:#95a7ad;font-size:13px}a{color:#c3f680}output{min-width:30px;font-variant-numeric:tabular-nums}@media(max-width:900px){.controls{grid-template-columns:1fr}header{display:block}header p{margin-top:8px}main{padding:15px}}
</style></head><body><main>
<header><h1>FRAGPUNK / 效果拆解</h1><p>静态图形 → 几何生成 → 材质与故障 shader</p></header>
<div id="viewer"><iframe id="frame" src="index.html" title="程序化动画"></iframe></div>
<div class="transport"><button id="play">播放</button><input id="scrub" type="range" min="0" max="4" step="0.001" value="1.5"><span id="time">1.500 s</span><button class="secondary" id="reset">重置</button></div>
<div class="controls">
<div class="card"><h2>换一张图形，复用同一套效果</h2><label><input id="text" type="text" placeholder="例如 CODEX" value="CODEX"><button id="replace">替换文字</button></label><label><input id="upload" type="file" accept="image/png,image/svg+xml,image/webp"></label><button id="original" class="secondary">恢复原 Logo</button><p>图片建议使用透明背景。碎片会根据新图形重新生成，shader 使用它的透明度轮廓。</p><p id="status">正在加载效果…</p></div>
<div class="card"><h2>逐层看图形逻辑</h2><label><span>显示层</span><select id="layer"><option value="all">完整效果</option><option value="geometry">闪电、冲击波、碎片</option><option value="logo">Logo 材质与故障</option></select></label><p>0.3s：变宽飘带<br>0.7–1.1s：冲击波、图形碎片归位<br>2.0–2.4s：偏移残影与色带<br>3.2–3.8s：斜切错位、噪声溶解</p></div>
<div class="card"><h2>调整算法参数</h2><label><span>飘带宽度</span><input type="range" data-param="ribbonWidth" min="0.3" max="2" step="0.05" value="1"><output>1.00</output></label><label><span>碎片离散</span><input type="range" data-param="fragmentSpread" min="0" max="2" step="0.05" value="1"><output>1.00</output></label><label><span>故障强度</span><input type="range" data-param="glitchStrength" min="0" max="2" step="0.05" value="1"><output>1.00</output></label><label><span>辉光</span><input type="range" data-param="bloom" min="0" max="0.6" step="0.01" value="0.16"><output>0.16</output></label></div>
</div><div class="links">源文件：<a href="renderer.js">几何与渲染逻辑</a> · <a href="shaders/material.frag">材质 / 故障 shader</a> · <a href="shaders/post.frag">辉光 / 颗粒 shader</a> · <a href="config.js">参数</a></div>
</main><script>
// This player uses a wall clock only to drive interactive preview. The actual
// composition receives an absolute time and remains deterministic under seek.
const frame=document.getElementById('frame'),viewer=document.getElementById('viewer'),scrub=document.getElementById('scrub'),time=document.getElementById('time'),play=document.getElementById('play');
let api,playing=false,last=0;
const fit=()=>frame.style.transform='scale('+viewer.clientWidth/1920+')';new ResizeObserver(fit).observe(viewer);
const show=t=>{scrub.value=t;time.textContent=Number(t).toFixed(3)+' s';if(api)api.renderAt(t);};
frame.onload=()=>{api=frame.contentWindow.fragpunk;show(1.5);document.getElementById('status').textContent='已生成 '+api.getShardCount()+' 块图形碎片';};
play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放';last=0;};
scrub.oninput=()=>show(Number(scrub.value));
function loop(now){if(playing&&api){if(last)show((Number(scrub.value)+(now-last)/1000)%4);last=now;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
document.getElementById('replace').onclick=()=>{api.setLogoText(document.getElementById('text').value||'CODEX');show(Number(scrub.value));document.getElementById('status').textContent='替换后重新生成 '+api.getShardCount()+' 块碎片';};
document.getElementById('original').onclick=()=>{api.setLogoText('');show(Number(scrub.value));};
document.getElementById('upload').onchange=e=>{const file=e.target.files[0];if(!file)return;const image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{api.setLogoImage(image);URL.revokeObjectURL(url);show(Number(scrub.value));};image.src=url;};
document.getElementById('layer').onchange=e=>{api.config.debugLayer=e.target.value;show(Number(scrub.value));};
document.querySelectorAll('[data-param]').forEach(input=>input.oninput=()=>{api.config[input.dataset.param]=Number(input.value);input.nextElementSibling.textContent=Number(input.value).toFixed(2);show(Number(scrub.value));});
document.getElementById('reset').onclick=()=>{playing=false;play.textContent='播放';frame.src='index.html';document.getElementById('layer').value='all';document.querySelectorAll('[data-param]').forEach(input=>{input.value=input.defaultValue;input.nextElementSibling.textContent=Number(input.value).toFixed(2);});};
</script></body></html>
